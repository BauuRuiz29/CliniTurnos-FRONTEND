<main class="patient-page">
	<app-sidebar [items]="menu" ariaLabel="Navegación del paciente" (cerrarSesion)="cerrarSesion()" />

	<section class="patient-content">
		<header class="patient-header">
			<div>
				<h1>Hola, {{ usuario()?.nombre }}</h1>
				<p>Gestioná tus turnos de manera simple</p>
			</div>
			<div class="patient-user" routerLink="mis-datos">
				<div class="patient-avatar" aria-hidden="true">{{ iniciales() }}</div>
				<div>
					<strong>{{ usuario()?.nombre }} {{ usuario()?.apellido }}</strong>
					<span>Paciente</span>
				</div>
			</div>
		</header>

		<router-outlet />
	</section>
</main>
