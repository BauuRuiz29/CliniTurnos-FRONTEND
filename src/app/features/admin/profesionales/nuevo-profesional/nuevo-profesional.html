<header class="page-header"><h1>Nuevo profesional</h1></header>

<form class="admin-form" [formGroup]="form" (ngSubmit)="guardar()" novalidate>
  <p>Completá los datos del profesional para darlo de alta en el sistema.</p>

  <div class="admin-fields">
    <label class="admin-field">Nombre(s)
      <input formControlName="nombre" placeholder="Ej: Martín" maxlength="50" autocomplete="off">
      @if (form.controls.nombre.touched && form.controls.nombre.invalid) { <small class="field-error">Ingresá el nombre.</small> }
    </label>
    <label class="admin-field">Apellido(s)
      <input formControlName="apellido" placeholder="Ej: García" maxlength="50" autocomplete="off">
      @if (form.controls.apellido.touched && form.controls.apellido.invalid) { <small class="field-error">Ingresá el apellido.</small> }
    </label>
    <label class="admin-field">Sexo
      <select formControlName="genero">
        <option [ngValue]="null" disabled>Seleccionar</option>
        @for (g of generos; track g.valor) { <option [ngValue]="g.valor">{{ g.texto }}</option> }
      </select>
      @if (form.controls.genero.touched && form.controls.genero.invalid) { <small class="field-error">Elegí una opción.</small> }
    </label>
    <span></span>

    <fieldset class="admin-checks admin-field--ancho">
      <legend>Especialidad(es)</legend>
      @for (e of especialidades(); track e.id) {
        <label><input type="checkbox" [checked]="elegidas().has(e.id)" (change)="alternarEspecialidad(e.id)"> {{ e.nombre }}</label>
      } @empty {
        <small>No hay especialidades cargadas.</small>
      }
    </fieldset>

    <label class="admin-field">Matrícula (opcional)
      <input formControlName="numeroMatricula" placeholder="Ej: MN 123456" maxlength="50" autocomplete="off">
    </label>
    <label class="admin-field">Tipo de matrícula
      <select formControlName="tipoMatricula">
        <option value="NACIONAL">Nacional</option>
        <option value="PROVINCIAL">Provincial</option>
      </select>
    </label>

    <label class="admin-field">Usuario
      <input formControlName="login" placeholder="Con el que va a ingresar" maxlength="50" autocomplete="off">
      @if (form.controls.login.touched && form.controls.login.invalid) { <small class="field-error">Ingresá un usuario.</small> }
    </label>
    <label class="admin-field">Contraseña
      <input formControlName="password" type="password" autocomplete="new-password">
      @if (form.controls.password.touched && form.controls.password.invalid) { <small class="field-error">Mínimo 8 caracteres.</small> }
    </label>
  </div>

  @if (error(); as mensaje) {
    <p class="admin-error" role="alert">{{ mensaje }}</p>
  }

  <div class="admin-form-actions">
    <a class="button-secondary" routerLink="/administrador/profesionales">Cancelar</a>
    <button type="submit" class="button-primary" [disabled]="guardando()">{{ guardando() ? 'Guardando...' : 'Guardar' }}</button>
  </div>
</form>
