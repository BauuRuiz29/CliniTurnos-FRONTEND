<header class="page-header"><h1>{{ id === null ? 'Nueva especialidad' : 'Editar especialidad' }}</h1></header>

<form class="admin-form" [formGroup]="form" (ngSubmit)="guardar()" novalidate>
  <p>Completá los datos de la especialidad.</p>

  <div class="admin-fields">
    <label class="admin-field admin-field--ancho">Nombre de la especialidad
      <input formControlName="nombre" placeholder="Ej: Cardiología" maxlength="100" autocomplete="off">
      @if (form.controls.nombre.touched && form.controls.nombre.invalid) { <small class="field-error">Ingresá el nombre.</small> }
    </label>
    <label class="admin-field admin-field--ancho">Descripción
      <textarea formControlName="descripcion" placeholder="Describí brevemente la especialidad" maxlength="225"></textarea>
      <small>{{ form.controls.descripcion.value.length }}/225</small>
    </label>
  </div>

  @if (error(); as mensaje) {
    <p class="admin-error" role="alert">{{ mensaje }}</p>
  }

  <div class="admin-form-actions">
    <a class="button-secondary" routerLink="/administrador/especialidades">Cancelar</a>
    <button type="submit" class="button-primary" [disabled]="guardando()">{{ guardando() ? 'Guardando...' : 'Guardar' }}</button>
  </div>
</form>
