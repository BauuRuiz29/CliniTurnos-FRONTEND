<header class="page-header"><h1>Notificaciones</h1></header>

<nav class="table-tabs" aria-label="Filtrar notificaciones">
  @for (f of filtros; track f) {
    <button type="button" [class.active]="filtro() === f" [attr.aria-pressed]="filtro() === f" (click)="filtro.set(f)">{{ f }}</button>
  }
</nav>

<div class="notifications-list">
  @for (n of visibles(); track n.id) {
    <button type="button" class="notification-row" [class.unread]="!n.leida" (click)="marcarLeida(n.id)">
      <span class="notification-symbol" aria-hidden="true">{{ simbolo(n) }}</span>
      <span class="notification-body"><strong>{{ n.titulo }}</strong><small>{{ n.texto }}</small></span>
      <span class="notification-time">{{ n.tiempo }}</span>
      @if (!n.leida) { <span class="unread-dot" aria-label="No leída"></span> }
    </button>
  } @empty {
    <p class="no-results">No hay notificaciones para mostrar.</p>
  }
</div>
