<header class="page-header"><h1>Notificaciones</h1></header>

<div class="notifications-list">
  @if (cargando()) {
    <p class="estado-carga">Cargando notificaciones...</p>
  } @else if (error()) {
    <p class="estado-carga estado-carga--error" role="alert">No pudimos cargar tus notificaciones. Intentá de nuevo.</p>
  } @else {
    @for (n of visibles(); track n.id) {
      <button type="button" class="notification-row" (click)="abrir(n)">
        <span class="notification-symbol" aria-hidden="true">{{ simbolo(n) }}</span>
        <span class="notification-body"><strong>{{ n.asunto }}</strong><small>{{ n.mensaje }}</small></span>
        <span class="notification-time">{{ cuando(n) }}</span>
      </button>
    } @empty {
      <p class="no-results">No hay notificaciones para mostrar.</p>
    }
  }
</div>
